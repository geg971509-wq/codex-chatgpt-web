name: Materialize verified B2 migration changes
on:
  push:
    branches: [audit/release-quality-20260906]
    paths: ['.audit/b2/**']
permissions:
  contents: write
concurrency:
  group: b2-migration-materialize
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Apply exact locally verified source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 287830df82f1a4c5c39ef86708a92e4bea061793
          cat .audit/b2/*.part | base64 --decode | gzip -dc > "$RUNNER_TEMP/b2.patch"
          printf '%s  %s\n' e81196c9c8f8c56042f4bf5de1223dbf71a77d19c399d6a237dd1156350041d3 "$RUNNER_TEMP/b2.patch" | sha256sum -c -
          git apply --check --unidiff-zero "$RUNNER_TEMP/b2.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/b2.patch"
          git rm .audit/b2/*.part .github/workflows/b2-materialize.yml
          git diff --cached --check
          test "$(git write-tree)" = 47a4a779a534758ec840c4a2fbff9e55678bef48
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: migrate upstream installations to the independent distribution with protected recovery'
          git push origin HEAD:audit/release-quality-20260906
          echo "B2_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "B2_SOURCE_TREE=$(git write-tree)"
