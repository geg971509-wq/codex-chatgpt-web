name: Temporary release audit

on:
  push:
    branches: [audit/release-quality-20260906]
    paths: [.github/release-audit.patch.gz.b64]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Apply the reviewed patch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = audit/release-quality-20260906
          base64 --decode .github/release-audit.patch.gz.b64 | gzip -d > /tmp/release-audit.patch
          echo '1b51db734bd1f2d739e7cd46b775464f7220e0a569dd44bb95a00e35ee48f94c  /tmp/release-audit.patch' | sha256sum --check
          git apply --check /tmp/release-audit.patch
          git apply /tmp/release-audit.patch
          git diff --check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Verify the fixed source
        shell: bash
        run: |
          if ! bun run verify > audit-verify.log 2>&1; then
            tail -120 audit-verify.log
            exit 1
          fi
          grep -E 'pass|# tests|# fail|SMOKE_OK|VERSION_SYNC' audit-verify.log | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-verification
          path: audit-verify.log
          retention-days: 7
      - name: Commit only verified project changes
        shell: bash
        run: |
          git add docs/security-model.md src/http-body.ts src/responses/state.ts tests/http-body.test.ts
          git add launcher/src/App.tsx launcher/electron/update-worker.cjs
          git add launcher/tests/renderer-state.test.cjs launcher/tests/renderer-wiring.test.cjs launcher/tests/update.test.cjs
          git rm .github/release-audit.patch.gz.b64
          git -c user.name='Release audit' -c user.email='release-audit@users.noreply.github.com' commit -m 'fix: close launcher state, updater failure, and request-size limits'
          git push origin HEAD:refs/heads/audit/release-quality-20260906
